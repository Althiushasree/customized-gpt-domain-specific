<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Domain-Specific GPT Chat</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f0f4f8;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 720px;
    }

    header {
      text-align: center;
      margin-bottom: 24px;
    }

    header h1 {
      font-size: 26px;
      font-weight: 700;
      color: #1a202c;
    }

    header p {
      font-size: 14px;
      color: #718096;
      margin-top: 6px;
    }

    .chat-box {
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      height: 520px;
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .messages::-webkit-scrollbar { width: 4px; }
    .messages::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 4px; }

    .placeholder {
      text-align: center;
      color: #a0aec0;
      font-size: 14px;
      margin: auto;
    }

    .placeholder svg {
      width: 48px;
      height: 48px;
      stroke: #cbd5e0;
      margin-bottom: 12px;
    }

    .message {
      display: flex;
      gap: 10px;
      animation: fadeIn 0.2s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .message.user { flex-direction: row-reverse; }

    .avatar {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 700;
      flex-shrink: 0;
    }

    .message.user .avatar  { background: #4299e1; color: #fff; }
    .message.bot  .avatar  { background: #e9d8fd; color: #6b46c1; }

    .bubble {
      max-width: 78%;
      padding: 10px 14px;
      border-radius: 14px;
      font-size: 14px;
      line-height: 1.6;
      word-break: break-word;
    }

    .message.user .bubble {
      background: #4299e1;
      color: #fff;
      border-bottom-right-radius: 4px;
    }

    .message.bot .bubble {
      background: #f7fafc;
      color: #2d3748;
      border: 1px solid #e2e8f0;
      border-bottom-left-radius: 4px;
    }

    .message.bot .bubble.error {
      background: #fff5f5;
      border-color: #fed7d7;
      color: #c53030;
    }

    .typing .bubble {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 14px;
    }

    .dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: #a0aec0;
      animation: bounce 1.2s infinite ease-in-out;
    }
    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); }
      30%           { transform: translateY(-6px); }
    }

    .input-row {
      display: flex;
      gap: 10px;
      padding: 16px;
      border-top: 1px solid #e2e8f0;
      background: #f7fafc;
    }

    input[type="text"] {
      flex: 1;
      padding: 10px 14px;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      font-size: 14px;
      outline: none;
      background: #fff;
      color: #2d3748;
      transition: border-color 0.15s;
    }

    input[type="text"]:focus { border-color: #4299e1; }
    input[type="text"]::placeholder { color: #a0aec0; }

    button#sendBtn {
      padding: 10px 20px;
      background: #4299e1;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
      white-space: nowrap;
    }

    button#sendBtn:hover:not(:disabled) { background: #3182ce; transform: scale(1.02); }
    button#sendBtn:disabled { background: #a0aec0; cursor: not-allowed; }

    footer {
      text-align: center;
      margin-top: 14px;
      font-size: 12px;
      color: #a0aec0;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>🤖 Domain-Specific GPT</h1>
      <p>Fine-tuned GPT-2 — ask anything about the domain</p>
    </header>

    <div class="chat-box">
      <div class="messages" id="messages">
        <div class="placeholder" id="placeholder">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"/>
          </svg>
          <p>Ask a question to get started</p>
        </div>
      </div>

      <div class="input-row">
        <input
          type="text"
          id="questionInput"
          placeholder="Type your question here..."
          maxlength="500"
          autocomplete="off"
        />
        <button id="sendBtn">Send</button>
      </div>
    </div>

    <footer>Powered by fine-tuned GPT-2 · Hugging Face Transformers</footer>
  </div>

  <script>
    const messagesEl = document.getElementById('messages');
    const inputEl    = document.getElementById('questionInput');
    const sendBtn    = document.getElementById('sendBtn');
    const placeholder = document.getElementById('placeholder');

    function removePlaceholder() {
      if (placeholder) placeholder.remove();
    }

    function addMessage(role, text, isError = false) {
      removePlaceholder();
      const row = document.createElement('div');
      row.className = `message ${role}`;

      const avatar = document.createElement('div');
      avatar.className = 'avatar';
      avatar.textContent = role === 'user' ? 'You' : 'AI';

      const bubble = document.createElement('div');
      bubble.className = 'bubble' + (isError ? ' error' : '');
      bubble.textContent = text;

      row.appendChild(avatar);
      row.appendChild(bubble);
      messagesEl.appendChild(row);
      messagesEl.scrollTop = messagesEl.scrollHeight;
      return row;
    }

    function showTyping() {
      removePlaceholder();
      const row = document.createElement('div');
      row.className = 'message bot typing';
      row.id = 'typing';
      row.innerHTML = `
        <div class="avatar">AI</div>
        <div class="bubble">
          <div class="dot"></div><div class="dot"></div><div class="dot"></div>
        </div>`;
      messagesEl.appendChild(row);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function removeTyping() {
      const t = document.getElementById('typing');
      if (t) t.remove();
    }

    async function sendMessage() {
      const question = inputEl.value.trim();
      if (!question) return;

      addMessage('user', question);
      inputEl.value = '';
      sendBtn.disabled = true;
      showTyping();

      try {
        const res = await fetch('/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ question }),
        });
        const data = await res.json();
        removeTyping();

        if (!res.ok || data.error) {
          addMessage('bot', data.error || 'An error occurred.', true);
        } else {
          addMessage('bot', data.response);
        }
      } catch (err) {
        removeTyping();
        addMessage('bot', 'Could not reach the server. Is Flask running?', true);
      } finally {
        sendBtn.disabled = false;
        inputEl.focus();
      }
    }

    sendBtn.addEventListener('click', sendMessage);
    inputEl.addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
    });
  </script>
</body>
</html>
